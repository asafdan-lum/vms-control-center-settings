<!DOCTYPE html>
<html>
<head><title>VMS Settings</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>html,body{height:100%;margin:0;overflow:hidden}a{color:#4367f6}a:hover{color:#3456e0}</style>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4367f6"/><text x="50" y="62" font-size="34" text-anchor="middle" fill="#fff" font-family="sans-serif">CC</text></svg></template>
</helmet>
<div style="position:relative;width:100vw;height:100vh">
<iframe src="VMS Settings - Control Center v6.dc.html" title="Control Center settings" style="position:absolute;inset:0;width:100%;height:100%;border:0;visibility:{{ setVis }}"></iframe>
<iframe src="Control Center Reports v2.dc.html" title="Control Center reports" style="position:absolute;inset:0;width:100%;height:100%;border:0;visibility:{{ repVis }}"></iframe>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'settings' };
  componentDidMount() {
    this._h = e => { const v = e.data && e.data.ccView; if (v === 'settings' || v === 'reports') this.setState({ view: v }); };
    window.addEventListener('message', this._h);
  }
  componentWillUnmount() { window.removeEventListener('message', this._h); }
  renderVals() {
    const r = this.state.view === 'reports';
    return { setVis: r ? 'hidden' : 'visible', repVis: r ? 'visible' : 'hidden' };
  }
}
</script>
</body>
</html>
